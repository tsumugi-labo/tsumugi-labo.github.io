<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>つむぎ研究所 ロゴ配色シミュレーター</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <header>

        <h1>つむぎ研究所</h1>

        <p>
            Logo Color Simulator
        </p>

    </header>

    <main>

        <section class="preview">

            <h2>プレビュー</h2>

            <div class="logo">

                <div class="bundle vertical lt round-top">
                    <span></span><span></span><span></span>
                </div>

                <div class="bundle vertical lb">
                    <span></span><span></span><span></span>
                </div>

                <div class="bundle vertical rt">
                    <span></span><span></span><span></span>
                </div>

                <div class="bundle vertical rb round-bottom">
                    <span></span><span></span><span></span>
                </div>

                <div class="bundle horizontal lu">
                    <span></span><span></span><span></span>
                </div>

                <div class="bundle horizontal ld round-left">
                    <span></span><span></span><span></span>
                </div>

                <div class="bundle horizontal ru round-right">
                    <span></span><span></span><span></span>
                </div>

                <div class="bundle horizontal rd">
                    <span></span><span></span><span></span>
                </div>

            </div>

            <p id="colorName">

                京友禅

            </p>

        </section>

        <section class="palette">

            <h2>

                配色セット

            </h2>

            <div class="palette-grid">

                <div class="color-card" data-name="京友禅" data-v="#7A4B2A" data-h1="#F7D358" data-h2="#5DAC81">

                    京友禅

                </div>

                <div class="color-card" data-name="大島紬" data-v="#563F2E" data-h1="#F3E9D2" data-h2="#165E83">

                    大島紬

                </div>

                <div class="color-card" data-name="牛首紬" data-v="#2B2B2B" data-h1="#CFCFCF" data <div class="color-card"
                    data-name="米沢織" data-v="#5B3A29" data-h1="#E8DFC9" data-h2="#355E8C">

                    米沢織

                </div>

                <div class="color-card" data-name="本場結城紬" data-v="#6A4B2A" data-h1="#F3E9D2" data-h2="#69821B">

                    本場結城紬

                </div>

                <div class="color-card" data-name="黄八丈" data-v="#8C4A2F" data-h1="#F4C430" data-h2="#5C7A29">

                    黄八丈

                </div>

                <div class="color-card" data-name="塩沢紬" data-v="#3E3E3E" data-h1="#E5E5E5" data-h2="#5DAC81">

                    塩沢紬

                </div>

                <div class="color-card" data-name="真田紐" data-v="#7A4B2A" data-h1="#D9A300" data-h2="#223A70">

                    真田紐

                </div>

                <div class="color-card" data-name="友禅" data-v="#9E3D3F" data-h1="#F8B500" data-h2="#5DAC81">

                    友禅

                </div>

                <div class="color-card" data-name="江戸小紋" data-v="#2F4858" data-h1="#DCDDD8" data-h2="#3C6E47">

                    江戸小紋

                </div>

                <div class="color-card" data-name="美濃和紙" data-v="#8A6A45" data-h1="#FFFFFC" data-h2="#7BA05B">

                    美濃和紙

                </div>

                <div class="color-card" data-name="越後上布" data-v="#4A4A4A" data-h1="#EFE8D8" data-h2="#6B8E23">

                    越後上布

                </div>

                <div class="color-card" data-name="輪島塗" data-v="#401A12" data-h1="#D4AF37" data-h2="#2F6B3B">

                    輪島塗

                </div>

                <div class="color-card" data-name="備前焼" data-v="#6B3E26" data-h1="#C9972E" data-h2="#556B2F">

                    備前焼

                </div>

                <div class="color-card" data-name="つむぎ研究所" data-v="#223A70" data-h1="#F3E9D2" data-h2="#3C6E47">

                    つむぎ研究所

                </div>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
