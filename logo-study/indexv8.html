<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>つむぎ研究所 ロゴ</title>

    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="logo">

    <!-- ======================
         Vertical
    ======================= -->

    <div class="arm vertical left-top">
        <div class="origin">
            <div class="thread outer round-top front"></div>
            <div class="thread center front"></div>
            <div class="thread inner front"></div>
        </div>
    </div>

    <div class="arm vertical left-bottom">
        <div class="origin">
            <div class="thread outer front"></div>
            <div class="thread center front"></div>
            <div class="thread inner front"></div>
        </div>
    </div>

    <div class="arm vertical right-top">
        <div class="origin">
            <div class="thread outer back"></div>
            <div class="thread center back"></div>
            <div class="thread inner back"></div>
        </div>
    </div>

    <div class="arm vertical right-bottom">
        <div class="origin">
            <div class="thread outer back"></div>
            <div class="thread center back"></div>
            <div class="thread inner round-bottom back"></div>
        </div>
    </div>


    <!-- ======================
         Horizontal
    ======================= -->

    <div class="arm horizontal left-top">
        <div class="origin">
            <div class="thread outer back"></div>
            <div class="thread center back"></div>
            <div class="thread inner back"></div>
        </div>
    </div>

    <div class="arm horizontal left-bottom">
        <div class="origin">
            <div class="thread outer round-left front"></div>
            <div class="thread center front"></div>
            <div class="thread inner front"></div>
        </div>
    </div>

    <div class="arm horizontal right-top">
        <div class="origin">
            <div class="thread outer back"></div>
            <div class="thread center back"></div>
            <div class="thread inner round-right back"></div>
        </div>
    </div>

    <div class="arm horizontal right-bottom">
        <div class="origin">
            <div class="thread outer front"></div>
            <div class="thread center front"></div>
            <div class="thread inner front"></div>
        </div>
    </div>

</div>

</body>
</html>
