<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 根付の本体（木や象牙の質感をイメージした丸みのある楕円） -->
  <ellipse cx="50" cy="55" rx="40" ry="42" fill="#e2ddd5" stroke="#c39a44" stroke-width="2"/>
  
  <!-- 平仮名の「つ」をモチーフにした、組紐が通る穴と和の文様 -->
  <path d="M35 45 C40 35, 65 35, 70 50 C75 70, 45 80, 30 75" fill="none" stroke="#35357D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- 根付紐を通すための小さな穴 -->
  <circle cx="50" cy="25" r="5" fill="#35357D"/>
  <circle cx="50" cy="25" r="2" fill="#F8F4E6"/>
</svg>
