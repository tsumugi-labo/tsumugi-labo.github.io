<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- 木目のグラデーション -->
    <radialGradient id="wood-base" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#D7A15C"/>
      <stop offset="50%" stop-color="#C0843E"/>
      <stop offset="100%" stop-color="#8B531B"/>
    </radialGradient>
    
    <!-- 紐穴用のシャドウ -->
    <radialGradient id="hole-shadow" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#2A1402"/>
      <stop offset="100%" stop-color="#6E3E11"/>
    </radialGradient>
  </defs>

  <!-- 根付（木彫り）の本体 -->
  <ellipse cx="50" cy="54" rx="42" ry="40" fill="url(#wood-base)" stroke="#5C320A" stroke-width="2.5"/>

  <!-- 年輪風の木目ライン -->
  <path d="M 18,48 C 25,28 75,25 82,50 C 85,72 25,82 18,52" fill="none" stroke="#A6682B" stroke-width="1.2" opacity="0.4"/>
  <path d="M 24,52 C 30,35 70,32 76,52 C 80,68 30,76 24,54" fill="none" stroke="#6E3E11" stroke-width="1" opacity="0.3"/>

  <!-- 根付紐を通す穴 -->
  <circle cx="50" cy="22" r="5.5" fill="url(#hole-shadow)"/>
  <circle cx="50" cy="22" r="6" fill="none" stroke="#3D1D03" stroke-width="1"/>

  <!-- 木彫りの「つ」の文字（彫り込みとハイライトの立体表現） -->
  <path d="M 28,44 C 36,33 66,33 72,46 C 76,64 48,76 30,70" fill="none" stroke="#2A1402" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
  <path d="M 28,42 C 36,31 66,31 72,44 C 76,62 48,74 30,68" fill="none" stroke="#3D1C02" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 30,41 C 37,32 64,32 70,43" fill="none" stroke="#E2B174" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
</svg>
